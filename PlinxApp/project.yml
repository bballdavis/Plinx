# ─────────────────────────────────────────────────────────────────────────────
# Plinx — XcodeGen Project Configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# Plinx is one codebase. `Core/` and `Platform/` hold the media, provider,
# session and feature code Plinx absorbed from Strimr (see
# docs/maintenance/upstream-strimr.md); the remaining folders are the Plinx
# app layer. Everything compiles into one app module per platform.
#
# Dependency flow:
#   Plinx app target
#     ├── App, Views, Adapters, ViewModels (Plinx layer)
#     ├── Core + Platform/<platform> (absorbed media stack)
#     ├── PlinxUI (SPM) → PlinxCore (SPM)
#     └── AetherEngine, GRDB, SwiftAssRenderer (SPM)
#
# Zero collection: no crash-reporting or analytics SDK is linked. The no-op
# ErrorReporter lives in App/ErrorReporter.swift.
#
# ─────────────────────────────────────────────────────────────────────────────

name: Plinx

options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "27.2"
  deploymentTarget:
    iOS: 18.0
    tvOS: 18.0
  postGenCommand: >-
    if [ -f ../scripts/support/patch_resources.py ]; then
      python3 ../scripts/support/patch_resources.py;
    else
      echo "Skipping local resource patch script in non-local environment.";
    fi

packages:
  PlinxCore:
    path: ../Packages/PlinxCore
  PlinxUI:
    path: ../Packages/PlinxUI
  AetherEngine:
    url: https://github.com/wunax/AetherEngine
    revision: b5695ba39215a9751031c93089494eb1b4241fdd
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.12.0
  SwiftAssRenderer:
    url: https://github.com/wunax/swift-ass-renderer
    revision: 5cbdf215fa149ca12685bb7d19ee18aa231e55bf

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.bballdavis.plinx
    # Team ID for code signing (do NOT include this in the bundle identifier)
    DEVELOPMENT_TEAM: Z8F9MLDQGX
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 2026.11.00
    SWIFT_OBJC_INTEROP_MODE: objcxx
    # Plinx branding: the product and display name is Plinx
    PRODUCT_NAME: Plinx

targets:
  Plinx-iOS:
    type: application
    platform: iOS
    productName: Plinx

    sources:
      # ── Plinx application code ──────────────────────────────────────
      - path: App
      - path: Views
      - path: Adapters
      - path: ViewModels

      # ── Absorbed media stack ────────────────────────────────────────
      - path: Core
      - path: Platform/iOS

    resources:
      # Privacy manifest (required for App Store)
      - path: Resources/PrivacyInfo.xcprivacy
      - path: Resources/Assets.xcassets
      - path: Resources/LaunchScreen.storyboard
      - path: Resources/DemoMedia
        type: folder
      # Localized strings — listed explicitly because xcodegen skips xcstrings
      # and needs lproj bundles spelled out.
      - path: Resources/en.lproj/Plinx.strings
      - path: Resources/Localizable.xcstrings

    dependencies:
      - package: PlinxCore
      - package: PlinxUI
      - package: AetherEngine
        product: AetherEngine
      - package: GRDB
        product: GRDB
      - package: SwiftAssRenderer
        product: SwiftAssRenderer

    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Plinx
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Standard platform and network encryption only; see the TestFlight
        # delivery runbook before changing this compliance declaration.
        ITSAppUsesNonExemptEncryption: false
        PlinxBuildConfiguration: $(CONFIGURATION)
        NSLocalNetworkUsageDescription: Plinx connects to your Plex and Jellyfin media servers and an optional parent-configured Youtarr service on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Picture in Picture and background audio need the audio background
        # mode. Both are parent settings, off by default; otherwise the player
        # closes when the app backgrounds (PlayerBackgroundPolicy).
        UIBackgroundModes:
          - audio
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 5.0
        # The absorbed media stack still has actor-isolation violations that
        # are errors in the Swift 6 compiler even in Swift 5 language mode.
        # Minimal concurrency keeps them as warnings until they are fixed.
        SWIFT_STRICT_CONCURRENCY: minimal
        # Override: force the frontend to treat concurrency as minimal.
        # This is needed because Xcode 26's toolchain promotes some
        # isolation checks to errors even under Swift 5 + minimal mode.
        # Remove once the media stack's actor isolation is fixed.
        OTHER_SWIFT_FLAGS: "-Xfrontend -strict-concurrency=minimal -Xfrontend -disable-dynamic-actor-isolation"

  Plinx-iOS-UnitTests:
    type: bundle.unit-test
    platform: iOS
    productName: PlinxUnitTests

    sources:
      - path: UnitTests
      # Tests of the absorbed media stack (Swift Testing). Their JSON fixtures
      # under CoreTests/Fixtures are copied flat into the test bundle, where
      # `Fixtures.data(_:)` finds them by name.
      - path: CoreTests

    resources:
      - path: UnitTests/Fixtures/YoutarrExternalAPIV1

    dependencies:
      - target: Plinx-iOS

    settings:
      base:
        PRODUCT_NAME: PlinxUnitTests
        PRODUCT_BUNDLE_IDENTIFIER: com.bballdavis.plinx.unittests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_SWIFT_FLAGS: "-Xfrontend -strict-concurrency=minimal"
        # Host the unit tests inside the running app process so they can access
        # all internal app types via @testable import Plinx.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Plinx.app/Plinx"
        BUNDLE_LOADER: "$(TEST_HOST)"

  Plinx-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    productName: PlinxUITests

    sources:
      - path: UITests
      - path: UnitTests/LiveTestCredentials.swift

    dependencies:
      - target: Plinx-iOS

    settings:
      base:
        PRODUCT_NAME: PlinxUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.bballdavis.plinx.uitests
        GENERATE_INFOPLIST_FILE: YES

# ─────────────────────────────────────────────────────────────────────────────
# Apple TV application target. It shares Plinx-owned policy and presentation
# layers with iOS and compiles the tvOS platform layer.
# ─────────────────────────────────────────────────────────────────────────────
  Plinx-tvOS:
    type: application
    platform: tvOS
    productName: Plinx

    sources:
      # ── Plinx application code ─────────────────────────────────────
      - path: App
        excludes:
          - "AppDelegate.swift"
          - "DownloadUITestFixtures.swift"
      - path: Views
        excludes:
          - "Downloads/**"
          - "Player/PlinxPlayerControlButtons.swift"
          - "Player/PlinxPlayerControlsView.swift"
      - path: Adapters
      - path: ViewModels

      # ── Absorbed media stack ────────────────────────────────────────
      - path: Core
        excludes:
          # Upstream's tvOS target membership: tvOS has its own versions of
          # these views, and offline storage and downloads are iOS-only.
          - "Features/Downloads/DownloadManager.swift"
          - "Features/Downloads/DownloadModels.swift"
          - "Features/Downloads/DownloadOptionsView.swift"
          - "Features/Downloads/DownloadRowViews.swift"
          - "Features/Library/LibraryBrowseViewModel.swift"
          - "Features/Library/LibraryCollectionsViewModel.swift"
          - "Features/MediaDetail/DetailFactsSection.swift"
          - "Features/MediaDetail/DetailHeroTitle.swift"
          - "Features/MediaDetail/DetailPlaybackCard.swift"
          - "Features/MediaDetail/DetailRoundActionLabel.swift"
          - "Features/MediaDetail/SeasonEpisodeComponents.swift"
          - "Features/Player/Controls/PlayerControlButtonStyle.swift"
          - "Features/Player/DoubleTapSeek.swift"
          - "Features/Player/PlayerLayoutMode.swift"
          - "Features/Seerr/SeerrDiscoverView.swift"
          - "Features/Seerr/SeerrManageRequestsSheetView.swift"
          - "Features/Seerr/SeerrMediaDetailView.swift"
          - "Features/Seerr/SeerrMediaRequestSheetView.swift"
          - "Features/Settings/SubtitleAppearanceSections.swift"
          - "Library/Player/PictureInPictureCoordinator.swift"
          - "Offline/Artwork/CachedArtworkService.swift"
          - "Offline/OfflineCoordinator.swift"
          - "Offline/Pinning/OfflineEnrichmentService.swift"
          - "Offline/Progress/PlaybackProgressRecorder.swift"
          - "Offline/Progress/ProgressSynchronizer.swift"
          - "Offline/Services/CachedDetailService.swift"
          - "Offline/Services/CachedHomeService.swift"
          - "Offline/Services/CachedLibraryService.swift"
          - "Offline/Services/CachedPlaylistService.swift"
          - "Offline/Services/CachedSearchService.swift"
          - "Offline/Services/OfflineCachePolicy.swift"
          - "Offline/Services/OfflineServiceDecorators.swift"
          - "Offline/Session/AccountRemovalFlow.swift"
          - "Offline/Session/OfflineSessionStore.swift"
          - "Offline/Store/OfflineDatabase.swift"
          - "Offline/Store/OfflineRecords.swift"
          - "Offline/Store/OfflineStore.swift"
          - "Offline/Views/OfflineMediaState.swift"
          - "Offline/Views/OfflineViews.swift"
          - "Offline/Views/SettingsStorageView.swift"
          - "Views/InsetListStyle.swift"
          - "Views/Seerr/SeerrDetailHeroTitle.swift"
          - "Views/Seerr/SeerrEpisodeCardView.swift"
          - "Views/Seerr/SeerrSeasonEpisodesSection.swift"
          - "Views/Theme/TileButtonStyle.swift"
      - path: Platform/tvOS

    resources:
      - path: Resources/PrivacyInfo.xcprivacy
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
      - path: Resources/en.lproj/Plinx.strings
      - path: Resources/DemoMedia
        type: folder

    dependencies:
      - package: PlinxCore
      - package: PlinxUI
      - package: AetherEngine
        product: AetherEngine
      - package: GRDB
        product: GRDB
      - package: SwiftAssRenderer
        product: SwiftAssRenderer

    info:
      path: Resources/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Plinx
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        PlinxBuildConfiguration: $(CONFIGURATION)
        NSLocalNetworkUsageDescription: Plinx connects to your Plex and Jellyfin media servers and an optional parent-configured Youtarr service on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconTV
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_SWIFT_FLAGS: "-Xfrontend -strict-concurrency=minimal -Xfrontend -disable-dynamic-actor-isolation"

  Plinx-tvOS-UnitTests:
    type: bundle.unit-test
    platform: tvOS
    productName: PlinxTVUnitTests

    sources:
      - path: UnitTestsTV
      - path: UnitTests/LiveTestCredentials.swift
      - path: UnitTests/PlayerTimelineTests.swift

    dependencies:
      - target: Plinx-tvOS

    settings:
      base:
        PRODUCT_NAME: PlinxTVUnitTests
        PRODUCT_BUNDLE_IDENTIFIER: com.bballdavis.plinx.tvos.unittests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_SWIFT_FLAGS: "-Xfrontend -strict-concurrency=minimal"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Plinx.app/Plinx"
        BUNDLE_LOADER: "$(TEST_HOST)"

  Plinx-tvOS-UITests:
    type: bundle.ui-testing
    platform: tvOS
    productName: PlinxTVUITests

    sources:
      - path: UITestsTV
      - path: UITests/PlayerTimelineUITests.swift

    dependencies:
      - target: Plinx-tvOS

    settings:
      base:
        PRODUCT_NAME: PlinxTVUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.bballdavis.plinx.tvos.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Plinx-iOS:
    shared: true
    build:
      targets:
        Plinx-iOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Plinx-iOS-UITests
        - name: Plinx-iOS-UnitTests
          parallelizable: false
      environmentVariables:
        - variable: PLINX_PLEX_SERVER_URL
          value: $(PLINX_PLEX_SERVER_URL)
        - variable: PLINX_PLEX_TOKEN
          value: $(PLINX_PLEX_TOKEN)
    archive:
      config: Release

  Plinx-tvOS:
    shared: true
    build:
      targets:
        Plinx-tvOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: Plinx-tvOS-UnitTests
          parallelizable: false
        - Plinx-tvOS-UITests
      environmentVariables:
        - variable: PLINX_PLEX_SERVER_URL
          value: $(PLINX_PLEX_SERVER_URL)
        - variable: PLINX_PLEX_TOKEN
          value: $(PLINX_PLEX_TOKEN)
    archive:
      config: Release
