# ─────────────────────────────────────────────────────────────────────────────
# Plinx — XcodeGen Project Configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# Architecture: "Skin, Don't Fork"
#
# Strimr sibling-repo sources compile INTO the Plinx-iOS app target (not as a
# separate framework). This is required because Strimr uses `internal` access
# on many types — compiling in the same module is the current way to access
# them without broadening upstream access control.
#
# Dependency flow:
#   PlinxApp (this target)
#     ├── Strimr sources (compiled inline, internal access)
#     ├── PlinxUI (SPM) → PlinxCore (SPM)
#     └── AetherEngine (SPM)
#
# Note: Sentry (crash reporting SDK) has been removed entirely as part of the
# zero-collection privacy commitment. Plinx provides its own no-op ErrorReporter
# (PlinxApp/App/ErrorReporter.swift) to satisfy Strimr's dependencies.
#
# ─────────────────────────────────────────────────────────────────────────────

name: Plinx

options:
  minimumXcodeGenVersion: 2.37.0
  deploymentTarget:
    iOS: 17.5
    tvOS: 17.0
  postGenCommand: >-
    if [ -f ../scripts/patch_resources.py ]; then
      python3 ../scripts/patch_resources.py;
    else
      echo "Skipping local resource patch script in non-local environment.";
    fi

packages:
  PlinxCore:
    path: ../Packages/PlinxCore
  PlinxUI:
    path: ../Packages/PlinxUI
  AetherEngine:
    url: https://github.com/wunax/AetherEngine
    revision: d882f47811757f8ebbf44e791abf96416262b49a

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.bballdavis.plinx
    # Team ID for code signing (do NOT include this in the bundle identifier)
    DEVELOPMENT_TEAM: Z8F9MLDQGX
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 2026.08.00
    SWIFT_OBJC_INTEROP_MODE: objcxx
    # Plinx branding — no Strimr references leak into the binary
    PRODUCT_NAME: Plinx

targets:
  Plinx-iOS:
    type: application
    platform: iOS

    sources:
      # ── Plinx application code ──────────────────────────────────────
      - path: App
      - path: Views
      - path: Decorators
      - path: Adapters
      - path: ViewModels

      # ── Strimr sibling-repo sources (compiled into app module) ──────
      # These compile as part of the Plinx-iOS module, giving our
      # decorators and adapters access to Strimr's internal types.
      - path: ../../strimr/Shared
        name: StrimrShared
        excludes:
          # Plinx replaces the generic launcher with a final fail-closed
          # authorization boundary immediately before queue creation.
          - "Features/Player/PlaybackLauncher.swift"
          # MediaBackdropGradient uses Color.background which is ambiguous
          # in iOS 26 SDK (resolves to BackgroundStyle, not Color).
          # Replaced by Adapters/PlinxMediaBackdropGradient.swift.
          - "Views/Media/MediaBackdropGradient.swift"
          # Plinx ships its own rating artwork names and renders the same
          # upstream model through a local label adapter.
          - "Views/Media/MediaRatingLabel.swift"
          # ErrorReporter would initialize Sentry. Plinx has zero data collection,
          # so we provide our own no-op ErrorReporter instead (App/ErrorReporter.swift).
          # See docs/security/privacy-and-safety.md for the privacy rationale.
          - "Monitoring/ErrorReporter.swift"
      - path: ../../strimr/Strimr-iOS/Features
        name: StrimrIOSFeatures
        excludes:
          # Strimr's own app entry point — we use PlinxApp.swift
          - "../StrimrApp.swift"
          # These views reference Strimr's asset catalog (Image(.icon) etc.)
          # and are replaced by Plinx-branded stubs in Views/Auth/.
          # Their ViewModels in Shared/ and Auth/SignInViewModel.swift still compile.
          - "Auth/SignInView.swift"
          - "Auth/ProfileSelection/ProfileSwitcherView.swift"
          - "Auth/ServerSelection/SelectServerView.swift"
          # Strimr's MainTabView uses iOS 18+ Tab API; Plinx has its own
          # RootTabView with Liquid Glass tab bar.
          - "Tab/MainTabView.swift"
          # Plinx owns the downloads settings surface. Keeping both files in
          # the same module produces a duplicate Swift filename error.
          - "Settings/SettingsDownloadsView.swift"
          # Strimr's ContentView — replaced by PlinxContentView.swift
          - "ContentView.swift"
          # Plinx uses larger, higher-contrast primary playback controls that
          # scale for phone, split-screen, and full-size iPad layouts.
          - "Player/Controls/PlayerControlButtons.swift"

    resources:
      # Privacy manifest (required for App Store)
      - path: Resources/PrivacyInfo.xcprivacy
      - path: Resources/Assets.xcassets
      - path: Resources/LaunchScreen.storyboard
      # Localized strings — listed explicitly because xcodegen skips xcstrings
      # and needs lproj bundles spelled out.
      - path: Resources/en.lproj/Plinx.strings
      - path: ../../strimr/Localizable.xcstrings

    dependencies:
      - package: PlinxCore
      - package: PlinxUI
      - package: AetherEngine
        product: AetherEngine

    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Plinx
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PlinxBuildConfiguration: $(CONFIGURATION)
        NSLocalNetworkUsageDescription: Plinx connects to Plex Media Servers and a parent-configured Youtarr server on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        # Ensure Strimr code compiles with our Swift version
        SWIFT_VERSION: 5.0
        # Strimr code has actor-isolation violations that are
        # errors in the Swift 6 compiler even with Swift 5 language mode.
        # Minimal concurrency turns them into warnings until vendor fixes.
        SWIFT_STRICT_CONCURRENCY: minimal
        # Override: force the frontend to treat concurrency as minimal.
        # This is needed because Xcode 26's toolchain promotes some
        # isolation checks to errors even under Swift 5 + minimal mode.
        # Remove once Strimr fixes its actor isolation (file upstream PR).
        OTHER_SWIFT_FLAGS: "-Xfrontend -strict-concurrency=minimal -Xfrontend -disable-dynamic-actor-isolation"

    scheme:
      shared: true
      build:
        targets:
          Plinx-iOS: all
      testTargets:
        - Plinx-iOS-UITests
        - Plinx-iOS-UnitTests
      run:
        config: Debug
      test:
        config: Debug

  Plinx-iOS-UnitTests:
    type: bundle.unit-test
    platform: iOS

    sources:
      - path: UnitTests

    # Bundle the live-test credentials file so tests running inside the iOS Simulator
    # can load it via Bundle(for: Self.self) — the host filesystem is inaccessible
    # from inside the simulator sandbox.
    # The file is copied to PlinxApp/UnitTests/test_creds.yaml (gitignored)
    # so XcodeGen can include it as an in-tree resource.
    resources:
      - path: UnitTests/test_creds.yaml
        optional: true
      - path: UnitTests/Fixtures/YoutarrExternalAPIV1

    dependencies:
      - target: Plinx-iOS

    settings:
      base:
        PRODUCT_NAME: PlinxUnitTests
        PRODUCT_BUNDLE_IDENTIFIER: com.bballdavis.plinx.unittests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_SWIFT_FLAGS: "-Xfrontend -strict-concurrency=minimal"
        # Host the unit tests inside the running app process so they can access
        # all internal types (vendor + Plinx) via @testable import Plinx_iOS.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Plinx.app/Plinx"
        BUNDLE_LOADER: "$(TEST_HOST)"

  Plinx-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS

    sources:
      - path: UITests

    resources:
      - path: UITests/test_creds.yaml
        optional: true

    dependencies:
      - target: Plinx-iOS

    settings:
      base:
        PRODUCT_NAME: PlinxUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.bballdavis.plinx.uitests
        GENERATE_INFOPLIST_FILE: YES

# ─────────────────────────────────────────────────────────────────────────────
# Apple TV target — diagnostic: surfaces what iOS-specific code needs tvOS
# adaptation. First build may fail on Plinx-owned layers; errors are expected
# and tracked as follow-up work.
# ─────────────────────────────────────────────────────────────────────────────
  Plinx-tvOS:
    type: application
    platform: tvOS

    sources:
      # ── Plinx application code (iOS-specific layers included for diagnostics)
      - path: App
        excludes:
          - "AppDelegate.swift"
          - "DownloadUITestFixtures.swift"
      - path: Views
        excludes:
          - "Downloads/**"
          - "Player/PlinxPlayerControlButtons.swift"
      - path: Decorators
      - path: Adapters
      - path: ViewModels

      # ── Strimr shared sources (same excludes as iOS target) ─────────────
      - path: ../../strimr/Shared
        name: StrimrShared
        excludes:
          - "Features/Player/PlaybackLauncher.swift"
          - "Views/Media/MediaBackdropGradient.swift"
          - "Views/Media/MediaRatingLabel.swift"
          - "Monitoring/ErrorReporter.swift"
          # tvOS ships paged focus-aware implementations with the same type
          # names as the sequential shared iOS view models.
          - "Features/Library/LibraryBrowseViewModel.swift"
          - "Features/Library/LibraryCollectionsViewModel.swift"

      # ── Strimr tvOS-specific UI features ────────────────────────────────
      - path: ../../strimr/Strimr-tvOS/Features
        name: StrimrTVOSFeatures
        excludes:
          # Strimr's own entry points — Plinx provides its own
          - "../StrimrApp.swift"
          - "../ContentView.swift"
          # Plinx uses its own tab root; Strimr's tvOS Tab uses tvOS 18-only APIs.
          - "Tab/**"
          # Plinx uses its own sign-in and does not need Strimr's tvOS sign-in view.
          - "Auth/SignInTVView.swift"

      # ── Strimr tvOS shared UI components ────────────────────────────────
      - path: ../../strimr/Strimr-tvOS/Shared
        name: StrimrTVOSShared

    resources:
      - path: Resources/PrivacyInfo.xcprivacy
      - path: Resources/Assets.xcassets
      - path: ../../strimr/Localizable.xcstrings

    dependencies:
      - package: PlinxCore
      - package: PlinxUI
      - package: AetherEngine
        product: AetherEngine

    info:
      path: Resources/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Plinx
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PlinxBuildConfiguration: $(CONFIGURATION)
        NSLocalNetworkUsageDescription: Plinx connects to Plex Media Servers on your local network when you choose a local server connection.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconTV
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_SWIFT_FLAGS: "-Xfrontend -strict-concurrency=minimal -Xfrontend -disable-dynamic-actor-isolation"

    scheme:
      shared: true
      build:
        targets:
          Plinx-tvOS: all
      testTargets:
        - Plinx-tvOS-UnitTests
        - Plinx-tvOS-UITests
      run:
        config: Debug
      test:
        config: Debug

  Plinx-tvOS-UnitTests:
    type: bundle.unit-test
    platform: tvOS

    sources:
      - path: UnitTestsTV

    resources:
      - path: UnitTestsTV/test_creds.yaml
        optional: true

    dependencies:
      - target: Plinx-tvOS

    settings:
      base:
        PRODUCT_NAME: PlinxTVUnitTests
        PRODUCT_BUNDLE_IDENTIFIER: com.bballdavis.plinx.tvos.unittests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_SWIFT_FLAGS: "-Xfrontend -strict-concurrency=minimal"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Plinx.app/Plinx"
        BUNDLE_LOADER: "$(TEST_HOST)"

  Plinx-tvOS-UITests:
    type: bundle.ui-testing
    platform: tvOS

    sources:
      - path: UITestsTV

    dependencies:
      - target: Plinx-tvOS

    settings:
      base:
        PRODUCT_NAME: PlinxTVUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.bballdavis.plinx.tvos.uitests
        GENERATE_INFOPLIST_FILE: YES
