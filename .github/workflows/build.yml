name: Build & Test (manual only)

# Automatic runs are paused while Xcode Cloud is the primary Apple-platform CI.
# Keep manual dispatch available for deliberate GitHub-side parity checks.
on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-guard:
    name: Docs Guard
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install docs guard tools
        run: brew install ripgrep

      - name: Run docs guard
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: bash ./scripts/docs_guard.sh

  swift-packages:
    name: Swift Package Tests
    runs-on: macos-26
    needs: docs-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned Strimr source
        env:
          STRIMR_REPO: "bballdavis/strimr"
        run: |
          set -euo pipefail
          source config/release-dependencies.env
          echo "Cloning ${STRIMR_REPO}@${STRIMR_COMMIT} into ../strimr"
          git clone --filter=blob:none "https://github.com/${STRIMR_REPO}.git" ../strimr
          git -C ../strimr checkout --force -B "$STRIMR_BRANCH" "$STRIMR_COMMIT"

      - name: Verify Strimr integration contract
        run: bash ./scripts/verify_strimr_integration_contract.sh --full

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Test PlinxCore
        run: |
          swift test \
            --package-path Packages/PlinxCore \
            --scratch-path "$RUNNER_TEMP/plinx-swiftpm/PlinxCore"

      - name: Test PlinxUI
        run: |
          swift test \
            --package-path Packages/PlinxUI \
            --scratch-path "$RUNNER_TEMP/plinx-swiftpm/PlinxUI"

  xcode-build-and-test:
    name: Xcode Build
    runs-on: macos-26
    needs: docs-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned Strimr source
        env:
          STRIMR_REPO: "bballdavis/strimr"
        run: |
          set -euo pipefail
          source config/release-dependencies.env
          echo "Cloning ${STRIMR_REPO}@${STRIMR_COMMIT} into ../strimr"
          git clone --filter=blob:none "https://github.com/${STRIMR_REPO}.git" ../strimr
          git -C ../strimr checkout --force -B "$STRIMR_BRANCH" "$STRIMR_COMMIT"

      - name: Fetch pinned Youtarr contract source
        run: |
          set -euo pipefail
          source config/youtarr-contract.env
          git clone --filter=blob:none https://github.com/bballdavis/Youtarr.git ../Youtarr
          git -C ../Youtarr checkout --detach "$YOUTARR_CONTRACT_COMMIT"
          npm ci --prefix ../Youtarr --omit=dev --ignore-scripts

      - name: Verify Youtarr contract fixture
        run: bash ./scripts/verify_youtarr_contract_fixture.sh --check

      - name: Verify Strimr integration contract
        run: bash ./scripts/verify_strimr_integration_contract.sh --full

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify checked-in Xcode project
        run: ./scripts/generate_xcodeproj.sh --check

      - name: Install and verify pinned simulator runtime
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! xcrun simctl list runtimes | grep -F "iOS 26.5" | grep -v "unavailable"; then
            xcodebuild -downloadPlatform iOS -buildVersion 26.5
          fi
          xcrun simctl list runtimes | grep -F "iOS 26.5"
          if ! xcrun simctl list devices available | grep -F "Plinx iPhone 17 Pro (26.5)"; then
            xcrun simctl create \
              "Plinx iPhone 17 Pro (26.5)" \
              com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro \
              com.apple.CoreSimulator.SimRuntime.iOS-26-5
          fi
          if ! xcrun simctl list devices available | grep -F "Plinx iPhone 17 Pro Max (26.5)"; then
            xcrun simctl create \
              "Plinx iPhone 17 Pro Max (26.5)" \
              com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max \
              com.apple.CoreSimulator.SimRuntime.iOS-26-5
          fi
          if ! xcrun simctl list devices available | grep -F "Plinx iPad Pro 13-inch (26.5)"; then
            xcrun simctl create \
              "Plinx iPad Pro 13-inch (26.5)" \
              com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-12GB \
              com.apple.CoreSimulator.SimRuntime.iOS-26-5
          fi

      - name: Build Plinx-iOS for iPhone and iPad
        run: |
          xcodebuild build-for-testing \
            -project PlinxApp/Plinx.xcodeproj \
            -scheme Plinx-iOS \
            -destination "platform=iOS Simulator,name=Plinx iPhone 17 Pro (26.5),OS=26.5" \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/plinx-derived-data" \
            -only-testing:Plinx-iOS-UnitTests/SeasonDownloadSelectionTests \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
          xcodebuild build-for-testing \
            -project PlinxApp/Plinx.xcodeproj \
            -scheme Plinx-iOS \
            -destination "platform=iOS Simulator,name=Plinx iPad Pro 13-inch (26.5),OS=26.5" \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/plinx-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Run focused app contract tests
        run: |
          xcodebuild test-without-building \
            -project PlinxApp/Plinx.xcodeproj \
            -scheme Plinx-iOS \
            -destination "platform=iOS Simulator,name=Plinx iPhone 17 Pro Max (26.5),OS=26.5" \
            -derivedDataPath "$RUNNER_TEMP/plinx-derived-data" \
            -only-testing:Plinx-iOS-UnitTests/YoutarrContractFixtureTests \
            -only-testing:Plinx-iOS-UnitTests/YoutarrFoundationTests \
            -only-testing:Plinx-iOS-UnitTests/YoutarrExploreTests \
            -only-testing:Plinx-iOS-UnitTests/YoutarrRequestTests \
            -only-testing:Plinx-iOS-UITests/SeasonDownloadOfflineUITests \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Run synthetic Youtarr HTTP integration gate
        env:
          PLINX_YOUTARR_DERIVED_DATA: ${{ runner.temp }}/plinx-derived-data
        run: bash ./scripts/tests/youtarr_synthetic_ui_tests.sh

  testflight-internal:
    name: Internal TestFlight delivery (dev-testflight)
    # This job remains dormant while the workflow is manual-only because a
    # workflow_dispatch event can never satisfy this push-only condition.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev-testflight'
    needs:
      - swift-packages
      - xcode-build-and-test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned Strimr source
        env:
          STRIMR_REPO: "bballdavis/strimr"
        run: |
          set -euo pipefail
          source config/release-dependencies.env
          echo "Cloning ${STRIMR_REPO}@${STRIMR_COMMIT} into ../strimr"
          git clone --filter=blob:none "https://github.com/${STRIMR_REPO}.git" ../strimr
          git -C ../strimr checkout --force -B "$STRIMR_BRANCH" "$STRIMR_COMMIT"

      - name: Verify Strimr integration contract
        run: bash ./scripts/verify_strimr_integration_contract.sh --full

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare App Store Connect API key
        id: app-store-key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for required_name in \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_API_ISSUER_ID \
            APP_STORE_CONNECT_API_PRIVATE_KEY; do
            if [ -z "${!required_name}" ]; then
              echo "Missing required GitHub Actions secret: ${required_name}" >&2
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          umask 077
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Archive and upload internal TestFlight build
        env:
          PLINX_CACHE_ROOT: ${{ runner.temp }}/plinx-cache
          PLINX_REPO_BUILD_ROOT: ${{ runner.temp }}/plinx-build
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ steps.app-store-key.outputs.path }}
        run: |
          set -euo pipefail
          bash ./scripts/build_release_archive.sh \
            --archive-path "$RUNNER_TEMP/Plinx.xcarchive" \
            --export-path "$RUNNER_TEMP/Plinx-TestFlight-export" \
            --upload-testflight \
            --api-key-path "$APP_STORE_CONNECT_API_KEY_PATH" \
            --api-key-id "$APP_STORE_CONNECT_API_KEY_ID" \
            --api-key-issuer-id "$APP_STORE_CONNECT_API_ISSUER_ID"
